name: CI

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Linting
    continue-on-error: "${{ github.ref != 'refs/heads/master' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up clang-format
        uses: egor-tensin/setup-clang@v2
        with:
          # To use the latest clang-format features:
          version: 22
      - name: Run clang-format
        uses: egor-tensin/clang-format@v1
        with:
          version: 22

  build:
    strategy:
      matrix:
        configuration:
          - debug
          - release
    runs-on: ubuntu-26.04
    # ^^^ Hardcoded Resolute for libsdl3
    name: |
      Build: ${{ matrix.configuration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -yq --no-install-recommends \
              libsdl3-dev \
              meson \
              ninja-build
      - name: Build
        run: |
          meson setup --buildtype=${{ matrix.configuration }} build
          ninja -C build
